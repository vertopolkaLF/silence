[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_windows.rs"
doctest = false

[features]
default = [ "gpui/default",]
test-support = [ "gpui/test-support",]
screen-capture = [ "gpui/screen-capture", "scap",]
small-overlay = []

[dependencies.gpui]
default-features = false
git = "https://github.com/zed-industries/zed"
rev = "a84689073d296dfd39987bc7dd478e43ef76d83a"

[package.metadata.cargo-shear]
ignored = [ "scap",]

[target."cfg(target_os = \"windows\")".dependencies]
windows-numerics = "0.3"

[target."cfg(target_os = \"windows\")".dependencies.accesskit]
version = "0.24.0"
features = [ "enumn",]

[target."cfg(target_os = \"windows\")".dependencies.accesskit_windows]
version = "0.34"

[target."cfg(target_os = \"windows\")".dependencies.anyhow]
version = "1.0.86"

[target."cfg(target_os = \"windows\")".dependencies.collections]
version = "0.1.0"
git = "https://github.com/zed-industries/zed"
rev = "a84689073d296dfd39987bc7dd478e43ef76d83a"

[target."cfg(target_os = \"windows\")".dependencies.dunce]
version = "1.0"

[target."cfg(target_os = \"windows\")".dependencies.etagere]
version = "0.2"

[target."cfg(target_os = \"windows\")".dependencies.futures]
version = "0.3.34"

[target."cfg(target_os = \"windows\")".dependencies.gpui_util]
git = "https://github.com/zed-industries/zed"
rev = "a84689073d296dfd39987bc7dd478e43ef76d83a"

[target."cfg(target_os = \"windows\")".dependencies.image]
version = "0.25.1"
default-features = false
features = [ "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp",]

[target."cfg(target_os = \"windows\")".dependencies.itertools]
version = "0.14.0"

[target."cfg(target_os = \"windows\")".dependencies.log]
version = "0.4.16"
features = [ "kv_unstable_serde", "serde",]

[target."cfg(target_os = \"windows\")".dependencies.parking_lot]
version = "0.12.1"

[target."cfg(target_os = \"windows\")".dependencies.rand]
version = "0.9"

[target."cfg(target_os = \"windows\")".dependencies.raw-window-handle]
version = "0.6"

[target."cfg(target_os = \"windows\")".dependencies.scheduler]
git = "https://github.com/zed-industries/zed"
rev = "a84689073d296dfd39987bc7dd478e43ef76d83a"

[target."cfg(target_os = \"windows\")".dependencies.smallvec]
version = "1.6"
features = [ "union", "const_new",]

[target."cfg(target_os = \"windows\")".dependencies.uuid]
version = "1.1.2"
features = [ "v4", "v5", "v7", "serde",]

[target."cfg(target_os = \"windows\")".dependencies.windows]
version = "0.62"
features = [ "Data_Xml_Dom", "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_System_StationsAndDesktops",]

[target."cfg(target_os = \"windows\")".dependencies.windows-core]
version = "0.62"

[target."cfg(target_os = \"windows\")".dependencies.windows-registry]
version = "0.6.0"

[target."cfg(target_os = \"windows\")".dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"
optional = true

[target."cfg(target_os = \"windows\")".build-dependencies.windows-registry]
version = "0.6.0"
