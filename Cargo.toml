[package]
name = "silence"
version = "2.5.0"
edition = "2024"

[features]
# Set only by the standalone volume-icon preview bin. Keeps Win32 out of that build.
volume_icon_raster_only = []

[dependencies]
anyhow = "1.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", default-features = false, features = ["windows-manifest"] }
gpui_windows = { path = "vendor/gpui_windows", default-features = false, features = ["small-overlay"] }
flume = "0.12"
raw-window-handle = { version = "0.6", features = ["std"] }
gilrs = "0.11.1"
once_cell = "1.21"
resvg = "0.47"
# Already built for GPUI; decodes the wallpaper for the OSD's fake Mica.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
rodio = "0.22.2"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
semver = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["fs", "io-util", "rt-multi-thread", "time"] }
winrt-toast = "0.1.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    # Real Mica under the volume popup (Windows.UI.Composition).
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-core = "0.58"

[build-dependencies]
winresource = "0.1"

# GPUI (layout, text shaping, rendering) is painfully slow at opt-level 0.
# Optimize dependencies in dev builds; our own crate stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
